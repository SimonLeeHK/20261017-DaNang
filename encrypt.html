<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>加密行程</title>
<style>
  body { margin:0; font:16px/1.5 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif; background:#F2F4F6; color:#14213D; }
  main { max-width:560px; margin:40px auto; padding:0 20px; }
  h1 { margin:0 0 6px; font-size:28px; }
  p { color:#5B6576; }
  form { display:grid; gap:16px; background:#fff; padding:22px; border-radius:20px; box-shadow:0 18px 40px -18px rgba(20,33,61,.35); }
  label { display:grid; gap:6px; font-weight:600; font-size:14px; }
  small { font-weight:400; color:#5B6576; }
  input { font:inherit; padding:10px 12px; border:1.5px solid #DCE1E7; border-radius:12px; }
  button { font:600 17px system-ui,sans-serif; padding:14px; border:0; border-radius:14px; background:#14213D; color:#fff; cursor:pointer; }
  #out { margin-top:16px; font-weight:600; white-space:pre-wrap; }
  .err { color:#CF3B26; }
</style>
</head>
<body>
<main>
  <h1>加密行程</h1>
  <p>Runs entirely in this browser. Nothing is uploaded. Pick your <b>trip.json</b>, type the password, and save the downloaded <b>trip.enc.json</b> into the repo folder, replacing the old one.</p>
  <form id="f">
    <label>trip.json <input id="plain" type="file" accept=".json,application/json" required></label>
    <label>密碼 Password <input id="pw" type="password" autocomplete="new-password" required></label>
    <label>再輸入一次 Confirm <input id="pw2" type="password" autocomplete="new-password" required></label>
    <label>現有 trip.enc.json <small>(optional) Keeps phones unlocked after an update when the password is unchanged.</small><input id="old" type="file" accept=".json,application/json"></label>
    <button type="submit">加密並下載 trip.enc.json</button>
  </form>
  <p id="out" role="status"></p>
</main>
<script>
const ITER = 600000;
const b64 = { to: u => btoa(String.fromCharCode(...new Uint8Array(u))), from: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
async function deriveKey(pw, salt, iter, use) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, { name: "AES-GCM", length: 256 }, false, use);
}
async function encrypt(text, pw, oldVault) {
  let salt = crypto.getRandomValues(new Uint8Array(16)), iter = ITER, note = "New salt: phones will ask for the password once.";
  if (oldVault) {
    try {
      const k = await deriveKey(pw, b64.from(oldVault.salt), oldVault.iter, ["decrypt"]);
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64.from(oldVault.iv) }, k, b64.from(oldVault.ct));
      salt = b64.from(oldVault.salt); iter = oldVault.iter; note = "Same password and salt: phones stay unlocked.";
    } catch { note = "Old vault did not open with this password, so a new salt was used. Phones will ask for the new password."; }
  }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, iter, ["encrypt"]);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
  return { vault: { v: 1, kdf: "PBKDF2-SHA256", iter, salt: b64.to(salt), iv: b64.to(iv), ct: b64.to(ct) }, note };
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const out = document.getElementById("out"), pw = document.getElementById("pw").value;
  out.className = "";
  try {
    if (pw !== document.getElementById("pw2").value) throw new Error("The two passwords do not match.");
    const text = await document.getElementById("plain").files[0].text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.days) || !Array.isArray(data.places) || !Array.isArray(data.tickets)) throw new Error("trip.json needs days, places and tickets.");
    if (!data.lang || !Array.isArray(data.money?.presets)) throw new Error("trip.json needs lang and money.presets.");
    const oldFile = document.getElementById("old").files[0];
    const { vault, note } = await encrypt(JSON.stringify(data), pw, oldFile ? JSON.parse(await oldFile.text()) : null);
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([JSON.stringify(vault)], { type: "application/json" })), download: "trip.enc.json" });
    a.click();
    out.textContent = `Done. trip.enc.json downloaded.\n${note}\nNext: replace the file in the repo, bump VERSION in sw.js, commit and push.`;
    window.__vault = vault;
  } catch (err) { out.className = "err"; out.textContent = err.message || String(err); }
};
</script>
</body>
</html>
